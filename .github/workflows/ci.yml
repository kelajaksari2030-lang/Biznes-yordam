name: BiznesYordam CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check frontend and shared code
        run: npm run lint

      - name: Build backend
        run: npm run build:server

      - name: Build frontend
        run: npm run build
